name: rust-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install declared MSRV
        shell: bash
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
      - name: Prepare dependency lock for audit
        shell: bash
        run: |
          if git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1; then
            cargo +1.90.0 fetch --locked
          else
            cargo +1.90.0 generate-lockfile
          fi
      - name: Format
        shell: bash
        run: cargo +1.90.0 fmt --all -- --check
      - name: Clippy
        shell: bash
        run: cargo +1.90.0 clippy --locked --all-targets -- -D warnings
      - name: Test
        shell: bash
        run: cargo +1.90.0 test --locked --all-targets
      - name: Require committed deterministic lockfile
        shell: bash
        run: |
          git ls-files --error-unmatch Cargo.lock >/dev/null
          git diff --exit-code -- Cargo.lock
