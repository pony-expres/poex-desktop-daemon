name: rust-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check out pinned common desktop runtime
        uses: actions/checkout@v4
        with:
          repository: ORESoftware/ores-common-desktop-infra
          ref: 7720f084155c8c3c92f714873516eb119826c296
          path: tmp/dev/ores-common-desktop-infra
          token: ${{ secrets.FLEET_GITHUB_READ_TOKEN }}
          persist-credentials: false
      - name: Verify pinned common desktop runtime
        shell: bash
        run: test "$(git -C tmp/dev/ores-common-desktop-infra rev-parse HEAD)" = "7720f084155c8c3c92f714873516eb119826c296"
      - name: Install declared MSRV
        shell: bash
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
      - name: Format
        shell: bash
        run: cargo +1.90.0 fmt --all -- --check
      - name: Clippy
        shell: bash
        run: cargo +1.90.0 clippy --all-targets -- -D warnings
      - name: Test
        shell: bash
        run: cargo +1.90.0 test --all-targets
