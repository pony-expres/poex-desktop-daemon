name: rust-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize-lock:
    if: github.event_name == 'pull_request' && github.head_ref == 'alexanderdmills/den-3045-lockfile'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out review branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Install declared MSRV
        shell: bash
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Materialize and verify reviewed lockfile
        shell: bash
        env:
          EXPECTED_LOCK_SHA256: 85dc4311fee5a9334fdae1dbe7193bb8a49b4a42ad149ac204dd0a3bc4bba4ae
        run: |
          cargo +1.90.0 generate-lockfile
          test "$(sha256sum Cargo.lock | awk '{print $1}')" = "$EXPECTED_LOCK_SHA256"
      - name: Commit exact reviewed lockfile if absent
        shell: bash
        run: |
          if git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'build: commit deterministic Cargo.lock'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

  rust:
    needs: materialize-lock
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install declared MSRV
        shell: bash
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
      - name: Verify committed lockfile
        shell: bash
        run: test -f Cargo.lock
      - name: Format
        shell: bash
        run: cargo +1.90.0 fmt --all -- --check
      - name: Clippy
        shell: bash
        run: cargo +1.90.0 clippy --locked --all-targets -- -D warnings
      - name: Test
        shell: bash
        run: cargo +1.90.0 test --locked --all-targets
