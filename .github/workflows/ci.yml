name: rust-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install declared MSRV
        shell: bash
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
      - name: Verify committed lockfile
        shell: bash
        run: test -f Cargo.lock
      - name: Clippy
        shell: bash
        run: cargo +1.90.0 clippy --locked --all-targets -- -D warnings
      - name: Test
        shell: bash
        run: cargo +1.90.0 test --locked --all-targets
      - name: Format
        shell: bash
        run: cargo +1.90.0 fmt --all -- --check
